stages:
  - lint
  - test
  - build
  - deploy

variables:
  IMAGE: ':'

lint:
  stage: lint
  image: python:3.11
  script:
    - pip install --no-cache-dir flake8
    - flake8 .
  allow_failure: true

test:
  stage: test
  image: python:3.11
  script:
    - pip install --no-cache-dir -r requirements.txt
    - pytest -q || echo 'pytest not available or tests failed'
  artifacts:
    when: always
    paths:
      - tests/

build_and_push:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - echo "" | docker login -u "" --password-stdin 
  script:
    - docker build -t "" .
    - docker push ""
  only:
    - main

deploy_production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H "" >> ~/.ssh/known_hosts
  script:
    - ssh -o StrictHostKeyChecking=no @ "
        docker pull  &&
        docker stop faceapp || true &&
        docker rm faceapp || true &&
        docker run -d --name faceapp -p 80:5000 
      "
  only:
    - main
  when: manual
