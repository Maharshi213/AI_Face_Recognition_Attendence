image: docker:24.0.0

variables:
  DOCKER_DRIVER: overlay2
  # Use GitLab registry: CI_REGISTRY and CI_REGISTRY_IMAGE are provided by GitLab
  IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA

services:
  - docker:24.0.0-dind

stages:
  - lint
  - test
  - build
  - security
  - deploy

before_script:
  - docker info

# 1. Lint python code
lint:
  stage: lint
  image: python:3.11
  script:
    - pip install --no-cache-dir flake8
    - flake8 .
  allow_failure: false

# 2. Run unit tests
test:
  stage: test
  image: python:3.11
  script:
    - pip install --no-cache-dir -r requirements.txt
    - pytest -q
  artifacts:
    when: always
    paths:
      - tests/

# 3. Security scan (basic)
security_scan:
  stage: security
  image: python:3.11
  script:
    - pip install bandit
    - bandit -r .

# 4. Build and push docker image to registry
build_and_push:
  stage: build
  image: docker:24.0.0
  services:
    - docker:24.0.0-dind
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
    - docker build -t "$IMAGE" .
    - docker push "$IMAGE"
  only:
    - main
  dependencies: []

# 5. Deploy (example: deploy to a remote server via SSH and docker pull)
deploy_production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
  script:
    # Pull image on remote host and restart container (requires SSH key in CI)
    - >
      ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_HOST "
        docker pull $CI_REGISTRY_IMAGE:$(echo $CI_COMMIT_SHORT_SHA) &&
        docker stop faceapp || true &&
        docker rm faceapp || true &&
        docker run -d --name faceapp -p 80:5000 $CI_REGISTRY_IMAGE:$(echo $CI_COMMIT_SHORT_SHA)
      "
  only:
    - main
